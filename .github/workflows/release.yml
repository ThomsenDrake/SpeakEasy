# Release build: push a tag vX.Y.Z (matching Cargo.toml's version) to test,
# build a universal macOS binary, sign it with the Developer ID and have
# Apple notarize it, and publish it as a GitHub release with
# speakeasy-macos-universal.tar.gz and its .sha256. Running the workflow by
# hand (Actions > Release > Run workflow) does the same build and keeps the
# archive as a workflow artifact, without publishing anything.
#
# Signing secrets (README, "Making a release"):
#   MACOS_SIGNING_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_SIGNING_CERTIFICATE_PASSWORD  its export password
# and for notarization either an App Store Connect API key
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
# or an Apple ID with an app-specific password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD
# A tag is never published unsigned; a manual run without them is ad-hoc
# signed, with a warning.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # gh release create
    env:
      CARGO_TERM_COLOR: always
      # the oldest macOS the binary runs on (Rust's own minimum for arm64)
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      ARCHIVE: speakeasy-macos-universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml's version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
          rustc --version

      - name: Test
        run: |
          cargo test --locked
          python3 scripts/test_agent_config.py
          python3 scripts/smoke_test.py
          bash -n scripts/install.sh

      - name: Build
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
          done
          mkdir -p dist
          lipo -create -output dist/slack-approval-gateway \
            target/aarch64-apple-darwin/release/slack-approval-gateway \
            target/x86_64-apple-darwin/release/slack-approval-gateway
          lipo -info dist/slack-approval-gateway

      - name: Sign and notarize
        env:
          CERT_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          bin=dist/slack-approval-gateway
          if [ -z "$CERT_P12" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::a release must be signed: set the MACOS_SIGNING_CERTIFICATE_P12 secrets (README, \"Making a release\")"
              exit 1
            fi
            echo "::warning::no signing certificate: this test build is only ad-hoc signed, not notarized"
            # (Apple silicon runs nothing unsigned)
            codesign --force --sign - "$bin"
            exit 0
          fi
          if [ -n "$API_KEY_P8" ]; then
            printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
            notary=(--key "$RUNNER_TEMP/notary-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          elif [ -n "$APPLE_ID" ]; then
            notary=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD")
          else
            echo "::error::signing needs notarization credentials too: the APPLE_API_KEY_* secrets, or APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD"
            exit 1
          fi

          # a keychain of its own for the Developer ID (deleted below)
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Apple's Developer ID intermediates, which an exported .p12 usually lacks
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" >/dev/null 2>&1 || true
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # the search list's paths have no spaces
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_SIGNING_CERTIFICATE_P12 holds no Developer ID Application identity"
            exit 1
          fi
          team="$(printf '%s' "$identity" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')"
          echo "signing as: $identity"

          # hardened runtime and a secure timestamp: what notarization requires
          codesign --force --options runtime --timestamp --keychain "$keychain" \
            --sign "$identity" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          codesign -dv "$bin" 2>&1 | grep -E 'Authority=Developer ID|TeamIdentifier|flags'

          # notarize (a bare binary can't be stapled: Gatekeeper looks the
          # ticket up online when the downloaded binary first runs)
          ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/notarize.zip"
          [ -n "$APPLE_ID" ] && [ -z "$API_KEY_P8" ] && notary+=(--team-id "$team")
          out="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary[@]}" \
            --wait --timeout 1h --output-format json)" || true
          echo "$out"
          id="$(printf '%s' "$out" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("id", ""))' 2>/dev/null || true)"
          status="$(printf '%s' "$out" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)"
          if [ "$status" != Accepted ]; then
            [ -n "$id" ] && xcrun notarytool log "$id" "${notary[@]}" || true
            echo "::error::notarization was not accepted (status: ${status:-none})"
            exit 1
          fi
          echo "notarized: submission $id"

      - name: Check the binary
        run: |
          codesign --verify --strict dist/slack-approval-gateway
          # the binary answers: a non-Slack hook call gets no opinion (--ok-code)
          rc=0
          printf '%s' '{"tool_name":"Bash","tool_input":{"command":"true"}}' \
            | dist/slack-approval-gateway --hook claude --wait 60 --ok-code 10 || rc=$?
          [ "$rc" = 10 ] || { echo "::error::the built binary's hook mode answered $rc, not 10"; exit 1; }

      - name: Package
        run: |
          pkg="dist/$ARCHIVE"
          mkdir -p "$pkg/bin" "$pkg/scripts"
          install -m 0755 dist/slack-approval-gateway "$pkg/bin/"
          install -m 0755 scripts/install.sh scripts/agent_config.py scripts/slack_mcp_oauth.py "$pkg/scripts/"
          install -m 0644 README.md LICENSE NOTICE.md "$pkg/"
          python3 scripts/third_party_licenses.py > "$pkg/THIRD_PARTY_LICENSES.md"
          printf '%s\n' "${{ steps.version.outputs.version }}" > "$pkg/VERSION"
          # no AppleDouble or extended-attribute entries in the archive
          COPYFILE_DISABLE=1 tar --no-mac-metadata --uid 0 --gid 0 --uname root --gname wheel \
            -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          (cd dist && shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256")
          tar -tzvf "dist/$ARCHIVE.tar.gz"
          cat "dist/$ARCHIVE.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}-${{ steps.version.outputs.version }}
          path: |
            dist/${{ env.ARCHIVE }}.tar.gz
            dist/${{ env.ARCHIVE }}.tar.gz.sha256
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/certificate.p12"

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=("dist/$ARCHIVE.tar.gz" "dist/$ARCHIVE.tar.gz.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # a re-run: replace the assets of the release it already made
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            prerelease=()
            case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag \
              --title "SpeakEasy $VERSION" --generate-notes "${prerelease[@]}"
          fi
