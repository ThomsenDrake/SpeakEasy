# Release build: push a tag vX.Y.Z (matching Cargo.toml's version) to test,
# build a universal macOS binary, and publish it as a GitHub release with
# speakeasy-macos-universal.tar.gz and its .sha256. Running the workflow by
# hand (Actions > Release > Run workflow) does the same build and keeps the
# archive as a workflow artifact, without publishing anything.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # gh release create
    env:
      CARGO_TERM_COLOR: always
      # the oldest macOS the binary runs on (Rust's own minimum for arm64)
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      ARCHIVE: speakeasy-macos-universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml's version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
          rustc --version

      - name: Test
        run: |
          cargo test --locked
          python3 scripts/test_agent_config.py
          python3 scripts/smoke_test.py
          bash -n scripts/install.sh

      - name: Build
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
          done
          mkdir -p dist
          lipo -create -output dist/slack-approval-gateway \
            target/aarch64-apple-darwin/release/slack-approval-gateway \
            target/x86_64-apple-darwin/release/slack-approval-gateway
          # ad-hoc signature over both slices (Apple silicon runs nothing unsigned)
          codesign --force --sign - dist/slack-approval-gateway
          lipo -info dist/slack-approval-gateway
          # the binary answers: a non-Slack hook call gets no opinion (--ok-code)
          rc=0
          printf '%s' '{"tool_name":"Bash","tool_input":{"command":"true"}}' \
            | dist/slack-approval-gateway --hook claude --wait 60 --ok-code 10 || rc=$?
          [ "$rc" = 10 ] || { echo "::error::the built binary's hook mode answered $rc, not 10"; exit 1; }

      - name: Package
        run: |
          pkg="dist/$ARCHIVE"
          mkdir -p "$pkg/bin" "$pkg/scripts"
          install -m 0755 dist/slack-approval-gateway "$pkg/bin/"
          install -m 0755 scripts/install.sh scripts/agent_config.py scripts/slack_mcp_oauth.py "$pkg/scripts/"
          install -m 0644 README.md NOTICE.md "$pkg/"
          python3 scripts/third_party_licenses.py > "$pkg/THIRD_PARTY_LICENSES.md"
          printf '%s\n' "${{ steps.version.outputs.version }}" > "$pkg/VERSION"
          # no AppleDouble or extended-attribute entries in the archive
          COPYFILE_DISABLE=1 tar --no-mac-metadata --uid 0 --gid 0 --uname root --gname wheel \
            -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          (cd dist && shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256")
          tar -tzvf "dist/$ARCHIVE.tar.gz"
          cat "dist/$ARCHIVE.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARCHIVE }}-${{ steps.version.outputs.version }}
          path: |
            dist/${{ env.ARCHIVE }}.tar.gz
            dist/${{ env.ARCHIVE }}.tar.gz.sha256
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=("dist/$ARCHIVE.tar.gz" "dist/$ARCHIVE.tar.gz.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # a re-run: replace the assets of the release it already made
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            prerelease=()
            case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag \
              --title "SpeakEasy $VERSION" --generate-notes "${prerelease[@]}"
          fi
