[package]
name = "slack-approval-gateway"
version = "0.1.0"
edition = "2021"
description = "Desktop approval gateway for agent-initiated Slack messages, exposed to agents as an MCP tool"

[lib]
name = "slack_approval_gateway"
path = "src/lib.rs"

[[bin]]
name = "slack-approval-gateway"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# custom-protocol: serve the embedded frontend (ui/dist) from
# tauri://localhost in every build instead of expecting a dev server.
tauri = { version = "2", features = ["custom-protocol"] }
ureq = { version = "3", features = ["json"] }

[build-dependencies]
tauri-build = "2"
